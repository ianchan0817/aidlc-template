# Project shape. Loaded EVERY session by all three tools — keep it declaration
# only. What each field switches: docs/project-shapes.md (read once, when filling
# this in). Contract: an undeclared surface's gates do not apply; a declared one's
# cannot be skipped. Adapt by editing this file, never by deleting methodology.
surfaces: [cli]
stateful: false
multi_tenant: false
release:
  channel: continuous
  rollback: revert-commit
  signals:
    - audit exit code
    - CI workflow result
    - broken internal references
    - adopter issue reports
  window: one green CI run on main
verify:
  test: bash scripts/audit.sh
  lint: bash -n scripts/audit.sh
  types: ""
  coverage: ""
  dep_audit: ""
  eval: ""
