name: code-quality

# Static analysis of what this template actually ships: shell. The safety
# controls are shell scripts, so a shell bug here is a security bug — see
# SECURITY.md. Results are uploaded as SARIF so they land in the repository's
# Code scanning tab rather than only in the job log.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif writes to the Code scanning tab
    steps:
      # SHA-pinned: `@v7` is a mutable name, a SHA is not. The trailing comment
      # is what Dependabot reads to bump the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck (SARIF for Code scanning)
        run: |
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh' 'init.sh.example')
          # An adopter repo with no tracked shell scripts is the normal case,
          # not an error. shellcheck with zero file arguments prints its usage
          # to stderr and writes nothing, so sc.json ended up empty and the
          # converter died on `json.load` of a 0-byte file — a hard red X for
          # having no shell to check. Synthesize the empty result instead, and
          # still upload it: an empty SARIF clears stale alerts.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no tracked shell scripts — emitting an empty result set"
            echo '{"comments":[]}' > sc.json
          else
            printf 'checking: %s\n' "${files[@]}"
            # -S warning: style nits shouldn't fail CI; real bugs should.
            shellcheck -S warning -f json1 "${files[@]}" > sc.json || true
            # `|| true` also swallows usage/crash exits, which produce no JSON.
            # Empty output means "shellcheck never ran", not "no findings" —
            # fail loudly rather than reporting a clean scan that never happened.
            if [ ! -s sc.json ]; then
              echo "::error::shellcheck produced no output for ${#files[@]} file(s)"
              exit 1
            fi
          fi
          python3 .github/scripts/shellcheck-to-sarif.py sc.json sarif.json

      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: sarif.json
          category: shellcheck

      - name: Fail on error-level findings
        run: |
          n=$(python3 -c "import json;d=json.load(open('sc.json'));print(sum(1 for c in d['comments'] if c['level']=='error'))")
          echo "error-level findings: $n"
          [ "$n" -eq 0 ] || { echo "::error::ShellCheck reported $n error(s)"; exit 1; }
