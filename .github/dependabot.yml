version: 2

updates:
  # The template's own only dependency surface: pinned action versions in
  # .github/workflows/. Keeping these current is what stops a supply-chain
  # regression from sitting in CI unnoticed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # --- Uncomment the ecosystem your project actually uses -------------------
  # Grouping minor+patch keeps the PR volume survivable; majors stay separate
  # so a breaking change never rides in on a routine bump.
  #
