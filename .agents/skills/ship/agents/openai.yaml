# `disable-model-invocation` in SKILL.md is a Claude Code field. Codex accepts
# only `name` and `description` there and ignores the rest silently, so on Codex
# the model could invoke /ship — which pushes and opens PRs — without being asked.
# Verified 2026-08-11 at https://learn.chatgpt.com/docs/build-skills:
# "When false, Codex won't implicitly invoke the skill based on user prompt;
#  explicit $skill invocation still works."
policy:
  allow_implicit_invocation: false
